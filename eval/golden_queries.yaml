# Golden query set for retrieval evaluation.
#
# Each query's `relevant` spans use start_sec/end_sec as OFFSETS INTO THE
# ORIGINAL SOURCE VIDEO (matching manifest.yaml's convention), not into the
# trimmed clip file. `speaker` is the real name from manifest.yaml.
#
# IMPORTANT (ground-truth source): every span here was built from the
# original diarized turn boundaries in transcripts/*.txt, NOT from the
# ingestion/chunking.py output (the `chunks` table / Chunk objects).
# Keep it that way: chunking's split (long turns) and merge (short
# backchannels) logic can change over time -- a threshold tweak, a
# different neighbor-merge preference, etc. -- and a chunk's start/end
# for a split or merged chunk is either an *estimate* (split) or spans
# more than one original turn (merge). If a label were built by reading
# chunk boundaries directly, it would silently encode whatever the
# chunker's current logic happens to produce, and go stale the next time
# that logic changes, without any visible sign that it happened. Anchoring
# to the transcript's own turns avoids that: the eval's ground truth is
# independent of the retrieval system's implementation details.
#
# Buckets:
#   exact_keyword  - a distinctive phrase actually spoken verbatim
#   paraphrase     - same meaning, different words (validated: <30% word
#                    overlap with the source span's text)
#   named_entity   - a proper noun / rare technical term
#   multi_span     - relevant to content in 2+ files
#
# Validate with: python eval/validate_queries.py

queries:
